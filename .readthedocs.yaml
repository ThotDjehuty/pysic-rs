# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
# Note: we intentionally do NOT `pip install .` on RTD.
# The Sphinx build only renders RST/MD pages; API pages are hand-written
# references (like Optimiz-rs), so no Rust extension build is required.
# This makes the documentation build robust and independent of maturin /
# PyO3 / abi3 toolchain availability on the RTD builder.