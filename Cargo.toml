[package]
name = "pysic-rs"
version = "0.2.0"
edition = "2021"
authors = ["HFThot Research Lab <contact@hfthot-lab.eu>"]
description = "High-performance mathematical physics engine with Python bindings"
license = "MIT"
repository = "https://github.com/ThotDjehuty/pysic-rs"
keywords = ["physics", "general-relativity", "quantum", "pde", "numerical"]
categories = ["science", "algorithms", "mathematics"]
readme = "README.md"
# Keep the published crate lean: library sources, the Python shim, licence and
# README only. Notebooks, build logs, docs config and CI live in the repository.
exclude = [
    ".cargo/*",
    ".github/*",
    "docs/*",
    "tests/*",
    "examples/*",
    "notebooks/*",
    "wheels/*",
    "dist/*",
    "target/*",
    "*.ipynb",
    "*.log",
    "*.gif",
    "*.png",
    "*.pdf",
    ".readthedocs.yaml",
]

[lib]
name = "pysic"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.22", optional = true }
ndarray = "0.15"
num-traits = "0.2"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
rayon = { version = "1.8", optional = true }
thiserror = "1.0"
rustfft = "6"

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
parallel = ["rayon"]

[dev-dependencies]
criterion = "0.5"
approx = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
